name: HomeTV

packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    from: 1.38.1
  SwiftCertificates:
    url: https://github.com/apple/swift-certificates.git
    from: 1.21.0

options:
  bundleIdPrefix: com.rexylin
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_LANGUAGE: zh-Hant

targets:
  HomeTV:
    type: application
    platform: iOS
    sources:
      - path: HomeTVApp
        excludes:
          - Info.plist
    info:
      path: HomeTVApp/Info.plist
      properties:
        NSLocalNetworkUsageDescription: HomeTV uses the local network to find and control your Android TV.
        NSBonjourServices:
          - _androidtvremote2._tcp
        NSMotionUsageDescription: HomeTV uses motion data to control the Android TV with device tilt.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rexylin.hometv
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: SwiftProtobuf
        product: SwiftProtobuf
      - package: SwiftCertificates
        product: X509
    scheme:
      testTargets:
        - HomeTVTests

  HomeTVTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HomeTVAppTests
    dependencies:
      - target: HomeTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rexylin.hometv.tests